[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bauvo-working-unit-extractor"
version = "0.1.0"
description = "Reviewable working-unit candidates from authoritative OCR pages"
requires-python = ">=3.10"
dependencies = ["google-genai>=1.0"]

[project.scripts]
bauvo-working-units = "bauvo_working_units.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
